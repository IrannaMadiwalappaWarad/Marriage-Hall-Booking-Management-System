# Application Name and Port
spring.application.name=marriage-hall-booking
server.port=8080

# Database Connection Details
spring.datasource.url=jdbc:mysql://localhost:3306/marriage_hall_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate and JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.hibernate.ddl-auto=update: This is a very powerful feature. 
#It tells Spring Data JPA to automatically create or update the table 
#structure in MySQL based on the Java code we will write in Step 3. 
#You won't have to write manual CREATE TABLE queries.